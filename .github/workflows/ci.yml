name: CI - Validação do Minicurso Git

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar linter (Flake8)
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Verificar Lint e Sintaxe (Flake8)
        run: |
          # Checagem de erros críticos de sintaxe e estilo PEP 8
          flake8 . --count --max-line-length=100 --show-source --statistics

      - name: Executar Testes Unitários do Core
        run: |
          # Roda os testes unitários do combate usando a biblioteca nativa unittest
          python -m unittest discover tests
